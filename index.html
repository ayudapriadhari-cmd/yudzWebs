<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGram | Next-Gen Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --dark: #000; --card-bg: #121212; --text: #fafafa; }
        body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; margin: 0; padding-bottom: 70px; }
        .hidden { display: none !important; }

        /* Header Instagram Style */
        header { position: sticky; top: 0; background: var(--dark); padding: 10px 20px; border-bottom: 1px solid #262626; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-family: 'Orbitron'; font-size: 1.2rem; color: var(--neon); margin: 0; }

        /* Stories Simulation */
        .stories-container { display: flex; overflow-x: auto; padding: 10px; gap: 15px; border-bottom: 1px solid #262626; }
        .story-circle { min-width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--purple); padding: 2px; }
        .story-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* Post Card Style */
        .post-card { border-bottom: 1px solid #262626; margin-bottom: 10px; }
        .post-header { display: flex; align-items: center; padding: 10px; gap: 10px; }
        .post-header .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--purple); }
        .post-img { width: 100%; aspect-ratio: 1/1; background: #262626; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .post-img img { width: 100%; height: 100%; object-fit: cover; }
        .post-content { padding: 10px; }
        .post-actions { display: flex; gap: 15px; font-size: 1.2rem; margin-bottom: 5px; }

        /* Bottom Nav */
        nav.bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--dark); border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 15px 0; z-index: 100; }
        .nav-item { cursor: pointer; color: #8e8e8e; font-size: 0.8rem; text-align: center; }
        .nav-item.active { color: var(--neon); font-weight: bold; }

        /* Admin UI */
        .admin-box { background: rgba(255, 0, 0, 0.1); border: 1px solid red; padding: 10px; margin: 10px; border-radius: 8px; font-size: 0.8rem; }
        
        input, textarea { width: 100%; padding: 10px; background: #262626; border: 1px solid #363636; color: white; border-radius: 5px; margin: 5px 0; }
        .btn { background: var(--neon); color: black; border: none; padding: 10px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-screen" style="padding: 50px 20px; text-align: center;">
        <h1 style="font-family: 'Orbitron'; color: var(--neon); font-size: 2.5rem;">CyberGram</h1>
        <div style="margin-top: 50px;">
            <input type="text" id="user" placeholder="Username">
            <input type="password" id="pass" placeholder="Password">
            <button onclick="handleLogin()" class="btn" style="margin-top: 20px;">Log In</button>
            <p style="font-size: 0.8rem; color: #8e8e8e; margin-top: 20px;">Belum punya akun? <span style="color:var(--neon); cursor:pointer;" onclick="alert('Gunakan Username & Password baru lalu tekan Log In untuk auto-register')">Daftar</span></p>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <header>
            <h1>CyberGram</h1>
            <div id="admin-indicator" class="hidden" style="color:red; font-size:0.7rem;">MASTER ADMIN</div>
        </header>

        <main id="main-content">
            <section id="page-home">
                <div class="stories-container" id="stories">
                    <div class="story-circle"><img src="https://picsum.photos/100/100?sig=1"></div>
                    <div class="story-circle"><img src="https://picsum.photos/100/100?sig=2"></div>
                    <div class="story-circle"><img src="https://picsum.photos/100/100?sig=3"></div>
                </div>
                <div id="feed-container"></div>
            </section>

            <section id="page-post" class="hidden" style="padding: 20px;">
                <h2>Create New Post</h2>
                <input type="text" id="post-img-url" placeholder="Paste link gambar (URL)">
                <textarea id="post-caption" placeholder="Tulis caption..."></textarea>
                <button onclick="submitPost()" class="btn">Share Post</button>
            </section>

            <section id="page-profile" class="hidden" style="padding: 20px;">
                <div style="text-align: center; margin-bottom: 30px;">
                    <div style="width: 80px; height: 80px; background: var(--purple); border-radius: 50%; margin: 0 auto 10px;"></div>
                    <h2 id="profile-name">Username</h2>
                    <button onclick="location.reload()" style="background:none; color:red; border:1px solid red; border-radius:5px; padding:5px 10px;">Logout</button>
                </div>
                
                <div id="admin-panel" class="hidden">
                    <h3 style="color:red;">Admin Database</h3>
                    <div id="db-list" class="admin-box"></div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="showPage('home')">🏠</div>
            <div class="nav-item" onclick="showPage('post')">➕</div>
            <div class="nav-item" onclick="showPage('profile')">👤</div>
        </nav>
    </div>

    <script>
        let currentUser = "";
        let posts = JSON.parse(localStorage.getItem('cg_posts') || '[]');

        function handleLogin() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            if(!u || !p) return alert("Isi data!");

            let db = JSON.parse(localStorage.getItem('cg_db') || '{"admin":{"pw":"root","role":"admin"}}');
            
            // Auto Register
            if(!db[u]) {
                db[u] = { pw: p, role: "user" };
                localStorage.setItem('cg_db', JSON.stringify(db));
            }

            if(db[u].pw === p) {
                currentUser = u;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('profile-name').innerText = u;
                if(db[u].role === 'admin') {
                    document.getElementById('admin-indicator').classList.remove('hidden');
                    document.getElementById('admin-panel').classList.remove('hidden');
                    loadAdminDB();
                }
                renderFeed();
            } else {
                alert("Password salah!");
            }
        }

        function showPage(p) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function submitPost() {
            const img = document.getElementById('post-img-url').value || 'https://picsum.photos/400/400?sig=' + Math.random();
            const cap = document.getElementById('post-caption').value;
            posts.unshift({ u: currentUser, img: img, cap: cap, likes: 0 });
            localStorage.setItem('cg_posts', JSON.stringify(posts));
            document.getElementById('post-img-url').value = "";
            document.getElementById('post-caption').value = "";
            showPage('home');
            renderFeed();
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = posts.map((p, i) => `
                <div class="post-card">
                    <div class="post-header">
                        <div class="avatar"></div>
                        <b>${p.u}</b>
                    </div>
                    <div class="post-img">
                        <img src="${p.img}">
                    </div>
                    <div class="post-content">
                        <div class="post-actions">❤️ 💬 ✈️</div>
                        <b>${p.u}</b> ${p.cap}
                    </div>
                </div>
            `).join('');
        }

        function loadAdminDB() {
            const db = JSON.parse(localStorage.getItem('cg_db'));
            const list = document.getElementById('db-list');
            list.innerHTML = Object.keys(db).map(u => `<div>• ${u} (PW: ${db[u].pw})</div>`).join('');
        }
    </script>
</body>
</html>
