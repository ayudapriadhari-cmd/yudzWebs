<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCore v2.0 | Integrated System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --dark: #050505; --red: #ff4444; --glass: rgba(255,255,255,0.05); }
        body { background: var(--dark); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .glass-card { background: var(--glass); padding: 20px; border-radius: 15px; border: 1px solid var(--neon); margin-bottom: 20px; }
        
        /* Typography */
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; color: var(--neon); text-transform: uppercase; }
        .admin-text { color: var(--red) !important; }

        /* Form Elements */
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--neon); color: white; border-radius: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: linear-gradient(45deg, var(--neon), var(--purple)); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }
        .btn-danger { background: var(--red); }

        /* Gallery */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .img-box { height: 120px; border-radius: 10px; overflow: hidden; border: 1px solid var(--purple); position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .img-box:hover img { transform: scale(1.2); filter: blur(2px); }

        /* Social/Table */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(0,0,0,0.3); }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; }
        .bg-red { background: var(--red); }
    </style>
</head>
<body>

    <div style="max-width: 900px; margin: auto;">
        
        <div id="auth-screen" class="glass-card" style="text-align: center;">
            <h1>System Entry</h1>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="handleLogin()">AUTHENTICATE</button>
            <p style="font-size: 0.8rem; color: #555;">Admin: admin / root</p>
        </div>

        <div id="user-dash" class="hidden">
            <div class="glass-card" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2>Welcome, <span id="my-name">User</span></h2>
                    <span>Followers: <b id="my-followers">0</b> | Following: <b id="my-following">0</b></span>
                </div>
                <button onclick="location.reload()" class="btn-danger">LOGOUT</button>
            </div>

            <div class="glass-card">
                <h3>Cloud Gallery</h3>
                <div class="gallery">
                    <div class="img-box"><img src="https://picsum.photos/200/300?sig=1"></div>
                    <div class="img-box"><img src="https://picsum.photos/200/300?sig=2"></div>
                    <div class="img-box"><img src="https://picsum.photos/200/300?sig=3"></div>
                </div>
            </div>

            <div class="glass-card">
                <h3>Global Chat</h3>
                <textarea id="msg-input" placeholder="Ketik pesan..."></textarea>
                <button onclick="postComment()">SEND</button>
                <div id="chat-box" style="margin-top: 15px; max-height: 200px; overflow-y: auto;"></div>
            </div>

            <div class="glass-card">
                <h3>Network Discover</h3>
                <div id="user-list-discover"></div>
            </div>
        </div>

        <div id="admin-panel" class="hidden">
            <div class="glass-card" style="border-color: var(--red);">
                <h1 class="admin-text">DATABASE CONTROL</h1>
                <p>Master Access: <span class="badge bg-red">ACTIVE</span></p>
                <button onclick="location.reload()" style="background:#333; margin-bottom: 20px;">BACK TO LOGIN</button>

                <h3>USER MANAGEMENT DATABASE</h3>
                <table>
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Credentials</th>
                            <th>Social Stats</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="db-table-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let me = "";

        // Inisialisasi Database
        if(!localStorage.getItem('core_db')) {
            const initialDB = {
                "admin": { password: "root", role: "admin", followers: [], following: [] },
                "yud": { password: "123", role: "user", followers: [], following: [] }
            };
            localStorage.setItem('core_db', JSON.stringify(initialDB));
        }

        function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            let db = JSON.parse(localStorage.getItem('core_db'));

            // Auto-Register jika baru
            if(!db[u] && u !== "") {
                db[u] = { password: p, role: "user", followers: [], following: [] };
                localStorage.setItem('core_db', JSON.stringify(db));
            }

            if(db[u] && db[u].password === p) {
                me = u;
                document.getElementById('auth-screen').classList.add('hidden');
                if(db[u].role === 'admin') showAdmin(); else showUser();
            } else {
                alert("Wrong credentials!");
            }
        }

        function showUser() {
            document.getElementById('user-dash').classList.remove('hidden');
            document.getElementById('my-name').innerText = me;
            updateStats();
            renderNetwork();
            loadChat();
        }

        function showAdmin() {
            document.getElementById('admin-panel').classList.remove('hidden');
            renderAdminDB();
        }

        // --- Fitur Social ---
        function updateStats() {
            const db = JSON.parse(localStorage.getItem('core_db'));
            document.getElementById('my-followers').innerText = db[me].followers.length;
            document.getElementById('my-following').innerText = db[me].following.length;
        }

        function renderNetwork() {
            const db = JSON.parse(localStorage.getItem('core_db'));
            const container = document.getElementById('user-list-discover');
            container.innerHTML = "";
            Object.keys(db).forEach(user => {
                if(user === me) return;
                const isFollowing = db[me].following.includes(user);
                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; padding:5px; border-bottom:1px solid #222;">
                        <span>@${user}</span>
                        <button onclick="toggleFollow('${user}')" style="padding:2px 10px; font-size:0.7rem;">
                            ${isFollowing ? 'Unfollow' : 'Follow'}
                        </button>
                    </div>`;
            });
        }

        function toggleFollow(target) {
            let db = JSON.parse(localStorage.getItem('core_db'));
            if(db[me].following.includes(target)) {
                db[me].following = db[me].following.filter(u => u !== target);
                db[target].followers = db[target].followers.filter(u => u !== me);
            } else {
                db[me].following.push(target);
                db[target].followers.push(me);
            }
            localStorage.setItem('core_db', JSON.stringify(db));
            updateStats(); renderNetwork();
        }

        // --- Fitur Chat ---
        function postComment() {
            const msg = document.getElementById('msg-input').value;
            if(!msg) return;
            let chats = JSON.parse(localStorage.getItem('core_chats') || '[]');
            chats.push({ user: me, text: msg });
            localStorage.setItem('core_chats', JSON.stringify(chats));
            document.getElementById('msg-input').value = "";
            loadChat();
        }

        function loadChat() {
            const chats = JSON.parse(localStorage.getItem('core_chats') || '[]');
            document.getElementById('chat-box').innerHTML = chats.reverse().map(c => `
                <div style="margin-bottom:8px; border-left:2px solid var(--purple); padding-left:10px;">
                    <b style="color:var(--neon)">${c.user}:</b> ${c.text}
                </div>`).join('');
        }

        // --- Fitur Admin Database UI ---
        function renderAdminDB() {
            const db = JSON.parse(localStorage.getItem('core_db'));
            const tbody = document.getElementById('db-table-body');
            tbody.innerHTML = "";
            Object.keys(db).forEach(u => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${u}</b> <br> <small>${db[u].role}</small></td>
                        <td>PW: <span style="color:var(--neon)">${db[u].password}</span></td>
                        <td>F: ${db[u].followers.length} | L: ${db[u].following.length}</td>
                        <td>
                            ${u !== 'admin' ? `<button onclick="deleteData('${u}')" class="badge bg-red" style="border:none; cursor:pointer;">PURGE</button>` : 'System'}
                        </td>
                    </tr>`;
            });
        }

        function deleteData(target) {
            if(confirm("Hapus data user ini secara permanen?")) {
                let db = JSON.parse(localStorage.getItem('core_db'));
                delete db[target];
                localStorage.setItem('core_db', JSON.stringify(db));
                renderAdminDB();
            }
        }
    </script>
</body>
</html>
