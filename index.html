<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCore v7.0 | The Final Boss</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --dark: #020205; --red: #ff3e3e; --glass: rgba(255,255,255,0.05); --text: white; }
        .light-mode { --dark: #f0f2f5; --text: #1a1a1a; --glass: rgba(0,0,0,0.05); --neon: #007bff; }
        
        body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; margin: 0; min-height: 100vh; padding: 20px; transition: 0.3s; }
        .hidden { display: none !important; }
        .glass { background: var(--glass); padding: 25px; border-radius: 15px; border: 1px solid var(--neon); width: 100%; max-width: 900px; margin: auto; box-shadow: 0 0 20px rgba(0, 242, 255, 0.1); }
        
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; color: var(--neon); }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,0,0,0.2); border: 1px solid var(--neon); color: var(--text); border-radius: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: linear-gradient(45deg, var(--neon), var(--purple)); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        
        /* News Feed */
        .feed-item { background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--neon); }
        .broadcast { background: rgba(255, 62, 62, 0.1); border: 1px solid var(--red); padding: 10px; margin-bottom: 20px; border-radius: 10px; text-align: center; color: var(--red); animation: blink 2s infinite; }
        
        @keyframes blink { 50% { opacity: 0.7; } }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--glass); padding: 15px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { padding: 8px; border-bottom: 1px solid #444; text-align: left; }
    </style>
</head>
<body>

    <div id="auth-screen" class="glass" style="max-width: 400px; text-align: center; margin-top: 5vh;">
        <h1>SYSTEM V7</h1>
        <input type="text" id="user" placeholder="Username">
        <input type="email" id="gmail" placeholder="Gmail (@gmail.com)" class="hidden">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="handleAuth()" id="btn-main">LOGIN</button>
        <p onclick="toggleReg()" id="toggle-text" style="cursor:pointer; text-decoration:underline; font-size:0.8rem; margin-top:10px;">Belum punya akun? Register</p>
    </div>

    <div id="main-ui" class="hidden">
        <div class="glass">
            <div id="broadcast-msg" class="hidden broadcast"></div>
            
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>CYBERCORE</h2>
                <div>
                    <button onclick="toggleTheme()" style="background:#444; font-size:0.7rem;">🌓 MODE</button>
                    <button onclick="location.reload()" style="background:var(--red);">LOGOUT</button>
                </div>
            </div>

            <div class="dashboard-grid">
                <div>
                    <div class="card">
                        <h3>Post Update</h3>
                        <textarea id="post-input" placeholder="Apa yang kamu pikirkan?"></textarea>
                        <button onclick="createPost()" style="width:100%;">POST TO FEED</button>
                    </div>
                    <div class="card" style="margin-top:20px;">
                        <h3>Feed Status</h3>
                        <div id="feed-container" style="max-height: 300px; overflow-y:auto;"></div>
                    </div>
                </div>

                <div>
                    <div class="card">
                        <h3>Network</h3>
                        <div id="network-list"></div>
                    </div>
                    
                    <div id="admin-area" class="hidden card" style="margin-top:20px; border: 1px solid var(--red);">
                        <h3 style="color:var(--red);">ADMIN POWERS</h3>
                        <input type="text" id="bc-input" placeholder="Pesan Broadcast...">
                        <button onclick="sendBroadcast()" style="background:var(--red); width:100%;">SEND BROADCAST</button>
                        
                        <h3 style="margin-top:20px;">USER DB</h3>
                        <div style="overflow-x:auto;">
                            <table id="admin-table"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sessionUser = "";
        let isReg = false;

        // DB INIT
        if(!localStorage.getItem('v7_db')) {
            localStorage.setItem('v7_db', JSON.stringify({
                "admin": { pw: "root", gmail: "admin@gmail.com", role: "admin", followers: [], following: [] }
            }));
        }

        function toggleReg() {
            isReg = !isReg;
            document.getElementById('gmail').classList.toggle('hidden');
            document.getElementById('btn-main').innerText = isReg ? "REGISTER" : "LOGIN";
            document.getElementById('toggle-text').innerText = isReg ? "Sudah punya akun? Login" : "Belum punya akun? Register";
        }

        function handleAuth() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            const g = document.getElementById('gmail').value;
            let db = JSON.parse(localStorage.getItem('v7_db'));

            if(isReg) {
                if(!g.includes("@gmail.com")) return alert("Gmail wajib!");
                db[u] = { pw: p, gmail: g, role: "user", followers: [], following: [] };
                localStorage.setItem('v7_db', JSON.stringify(db));
                alert("Berhasil!"); location.reload();
            } else {
                if(db[u] && db[u].pw === p) {
                    sessionUser = u;
                    loadSystem();
                } else alert("Gagal!");
            }
        }

        function loadSystem() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            const db = JSON.parse(localStorage.getItem('v7_db'));
            
            if(db[sessionUser].role === 'admin') {
                document.getElementById('admin-area').classList.remove('hidden');
                renderAdmin();
            }
            renderFeed();
            renderNetwork();
            checkBroadcast();
        }

        // FEED SYSTEM
        function createPost() {
            const txt = document.getElementById('post-input').value;
            if(!txt) return;
            let posts = JSON.parse(localStorage.getItem('v7_posts') || '[]');
            posts.unshift({ u: sessionUser, t: txt, time: new Date().toLocaleString() });
            localStorage.setItem('v7_posts', JSON.stringify(posts));
            document.getElementById('post-input').value = "";
            renderFeed();
        }

        function renderFeed() {
            const posts = JSON.parse(localStorage.getItem('v7_posts') || '[]');
            document.getElementById('feed-container').innerHTML = posts.map(p => `
                <div class="feed-item">
                    <b>@${p.u}</b> <small style="float:right">${p.time}</small><br>
                    <span>${p.t}</span>
                </div>
            `).join('');
        }

        // ADMIN FEATURES
        function sendBroadcast() {
            const msg = document.getElementById('bc-input').value;
            localStorage.setItem('v7_bc', msg);
            alert("Broadcast Terkirim!");
            location.reload();
        }

        function checkBroadcast() {
            const bc = localStorage.getItem('v7_bc');
            if(bc) {
                const el = document.getElementById('broadcast-msg');
                el.innerText = "📢 ADMIN: " + bc;
                el.classList.remove('hidden');
            }
        }

        function renderAdmin() {
            const db = JSON.parse(localStorage.getItem('v7_db'));
            let h = "<tr><th>User</th><th>Pass</th><th>Aksi</th></tr>";
            for(let u in db) {
                h += `<tr><td>${u}</td><td>${db[u].pw}</td><td><button onclick="delUser('${u}')" style="background:red; padding:2px 5px; font-size:0.6rem;">X</button></td></tr>`;
            }
            document.getElementById('admin-table').innerHTML = h;
        }

        function delUser(u) {
            let db = JSON.parse(localStorage.getItem('v7_db'));
            delete db[u];
            localStorage.setItem('v7_db', JSON.stringify(db));
            renderAdmin();
        }

        // THEME
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function renderNetwork() {
            const db = JSON.parse(localStorage.getItem('v7_db'));
            let h = "";
            for(let u in db) { if(u !== sessionUser) h += `<div>@${u}</div>`; }
            document.getElementById('network-list').innerHTML = h;
        }
    </script>
</body>
</html>
