<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGram v14 | Mutual System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --dark: #000; --text: #fafafa; --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; margin: 0; padding-bottom: 70px; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* Story Viewer */
        #story-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: flex; flex-direction: column; }
        .progress-bar { height: 2px; background: #fff; width: 0%; transition: width 4s linear; margin-top: 10px; }

        /* Instagram Layout */
        header { position: sticky; top: 0; background: var(--dark); padding: 15px; border-bottom: 1px solid #262626; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .stories-scroll { display: flex; overflow-x: auto; padding: 10px; gap: 15px; border-bottom: 1px solid #262626; scrollbar-width: none; }
        .ring { width: 55px; height: 55px; border-radius: 50%; background: var(--insta-grad); padding: 2px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .ring img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #000; }

        /* Chat UI */
        #chat-window { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 2001; display: flex; flex-direction: column; }
        .chat-msg { max-width: 70%; padding: 10px; border-radius: 10px; margin: 5px; }
        .sent { align-self: flex-end; background: var(--purple); }
        .received { align-self: flex-start; background: #333; }

        /* Nav */
        nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 15px 0; z-index: 100; }
        .nav-item { color: #8e8e8e; cursor: pointer; font-size: 1.4rem; }
        .active { color: var(--neon); }
        
        button { background: var(--neon); border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        input { padding: 10px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 5px; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="loading-screen" style="position:fixed; width:100%; height:100%; background:#000; z-index:9999; display:flex; justify-content:center; align-items:center;">
        <h1 style="font-family:'Orbitron'; color:var(--neon);">CyberGram</h1>
    </div>

    <div id="chat-window" class="hidden">
        <div style="padding:15px; border-bottom:1px solid #222; display:flex; align-items:center; gap:10px;">
            <button onclick="closeChat()" style="background:none; color:var(--neon); font-size:1.5rem;">←</button>
            <b id="chat-target-name">User</b>
        </div>
        <div id="chat-content" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column;"></div>
        <div style="padding:15px; display:flex; gap:10px; border-top:1px solid #222;">
            <input type="text" id="msg-input" placeholder="Message..." style="flex:1">
            <button onclick="sendMsg()">SEND</button>
        </div>
    </div>

    <div id="story-viewer" class="hidden" onclick="closeStory()">
        <div style="padding:10px;"><div id="p-bar" class="progress-bar"></div></div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center;">
            <img id="s-img" src="" style="max-width:100%; max-height:80vh;">
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <header>
            <h1 style="font-family:'Orbitron'; font-size:1.2rem; color:var(--neon);">CyberGram</h1>
            <div onclick="showPage('chat')" style="cursor:pointer; font-size:1.4rem;">📩</div>
        </header>

        <main>
            <section id="page-home">
                <div class="stories-scroll" id="stories-list"></div>
                <div id="feed-list" style="padding:10px;"></div>
            </section>

            <section id="page-discover" class="hidden" style="padding:15px;">
                <h3>Discover People</h3>
                <div id="discover-list"></div>
            </section>

            <section id="page-chat" class="hidden" style="padding:15px;">
                <h3>Mutual Direct Messages</h3>
                <div id="chat-list"></div>
                <p id="chat-hint" style="color:#666; font-size:0.8rem; margin-top:20px;">ℹ️ Kamu hanya bisa chat dengan orang yang saling follow (Mutual).</p>
            </section>

            <section id="page-profile" class="hidden" style="text-align:center; padding:20px;">
                <img id="my-pic" src="" style="width:80px; height:80px; border-radius:50%; border:2px solid var(--neon);">
                <h2 id="my-user"></h2>
                <button onclick="logout()" style="background:red; color:white; width:100%;">LOGOUT</button>
            </section>
        </main>

        <nav>
            <div class="nav-item active" onclick="showPage('home')">🏠</div>
            <div class="nav-item" onclick="showPage('discover')">🔍</div>
            <div class="nav-item" onclick="showPage('profile')">👤</div>
        </nav>
    </div>

    <div id="auth-screen" class="hidden" style="padding:100px 20px; text-align:center;">
        <h1 style="font-family:'Orbitron'; color:var(--neon);">CyberGram</h1>
        <input type="text" id="login-user" placeholder="Username" style="width:80%"><br>
        <input type="password" id="login-pass" placeholder="Password" style="width:80%"><br>
        <button onclick="handleLogin()" style="width:80%; margin-top:10px;">LOGIN</button>
    </div>

    <script>
        let me = "";
        let activeTarget = "";
        let db = JSON.parse(localStorage.getItem('cg_v14_db') || '{}');
        let msgs = JSON.parse(localStorage.getItem('cg_v14_msgs') || '[]');

        window.onload = function() {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                me = sessionStorage.getItem('activeUser');
                if (me) {
                    document.getElementById('app-screen').classList.remove('hidden');
                    initData();
                } else {
                    document.getElementById('auth-screen').classList.remove('hidden');
                }
            }, 1000);
        };

        function handleLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;
            if(!u || !p) return;
            if(!db[u]) db[u] = { pw:p, ava:`https://picsum.photos/200/200?sig=${u}`, following:[] };
            if(db[u].pw === p) {
                me = u;
                sessionStorage.setItem('activeUser', u);
                localStorage.setItem('cg_v14_db', JSON.stringify(db));
                location.reload();
            } else alert("Wrong!");
        }

        function logout() { sessionStorage.removeItem('activeUser'); location.reload(); }

        function showPage(p) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(p === 'discover') renderDiscover();
            if(p === 'chat') renderChatList();
        }

        function initData() {
            document.getElementById('my-user').innerText = me;
            document.getElementById('my-pic').src = db[me].ava;
            renderStories();
        }

        // --- MUTUAL SYSTEM LOGIC ---
        function isMutual(otherUser) {
            // Cek apakah saya follow dia DAN dia follow saya
            const iFollowHim = db[me].following.includes(otherUser);
            const heFollowsMe = db[otherUser].following.includes(me);
            return iFollowHim && heFollowsMe;
        }

        function renderDiscover() {
            document.getElementById('discover-list').innerHTML = Object.keys(db).filter(u => u !== me).map(u => {
                const isF = db[me].following.includes(u);
                const isM = isMutual(u);
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <img src="${db[u].ava}" style="width:40px; height:40px; border-radius:50%">
                            <span><b>${u}</b> ${isM ? ' (Mutual)' : ''}</span>
                        </div>
                        <button onclick="toggleFollow('${u}')" style="${isF?'background:#333;color:white':''}">
                            ${isF ? 'Following' : 'Follow'}
                        </button>
                    </div>`;
            }).join('');
        }

        function toggleFollow(u) {
            if(db[me].following.includes(u)) db[me].following = db[me].following.filter(x => x !== u);
            else db[me].following.push(u);
            localStorage.setItem('cg_v14_db', JSON.stringify(db));
            renderDiscover();
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            // Hanya tampilkan user yang MUTUAL
            const mutuals = Object.keys(db).filter(u => u !== me && isMutual(u));
            
            list.innerHTML = mutuals.map(u => `
                <div onclick="openChat('${u}')" style="display:flex; align-items:center; gap:15px; padding:10px; border-bottom:1px solid #111; cursor:pointer;">
                    <img src="${db[u].ava}" style="width:45px; height:45px; border-radius:50%">
                    <b>${u}</b>
                </div>
            `).join('') || '<p style="color:#666">Belum ada teman mutual. Saling follow dulu yuk!</p>';
        }

        // --- CHAT & STORY CORE ---
        function openChat(target) {
            activeTarget = target;
            document.getElementById('chat-target-name').innerText = target;
            document.getElementById('chat-window').classList.remove('hidden');
            renderMsgs();
        }

        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            if(!input.value) return;
            msgs.push({ f:me, t:activeTarget, txt:input.value });
            localStorage.setItem('cg_v14_msgs', JSON.stringify(msgs));
            input.value = "";
            renderMsgs();
        }

        function renderMsgs() {
            const box = document.getElementById('chat-content');
            box.innerHTML = msgs.filter(m => (m.f===me && m.t===activeTarget) || (m.f===activeTarget && m.t===me))
                .map(m => `<div class="chat-msg ${m.f===me?'sent':'received'}">${m.txt}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        function renderStories() {
            document.getElementById('stories-list').innerHTML = Object.keys(db).map(u => `
                <div class="ring" onclick="openStory('${u}')"><img src="${db[u].ava}"></div>
            `).join('');
        }

        function openStory(u) {
            document.getElementById('s-img').src = `https://picsum.photos/400/800?sig=${u}`;
            document.getElementById('story-viewer').classList.remove('hidden');
            const bar = document.getElementById('p-bar');
            bar.style.width = '0%';
            setTimeout(() => bar.style.width = '100%', 50);
            window.sTimer = setTimeout(closeStory, 4000);
        }

        function closeStory() { document.getElementById('story-viewer').classList.add('hidden'); clearTimeout(window.sTimer); }
    </script>
</body>
</html>
