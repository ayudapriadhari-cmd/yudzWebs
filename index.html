                </div<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGram v12 | Follow to Message</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --dark: #000; --text: #fafafa; --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; margin: 0; padding-bottom: 70px; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* Splash & Header */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        header { position: sticky; top: 0; background: var(--dark); padding: 15px; border-bottom: 1px solid #262626; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-family: 'Orbitron'; font-size: 1.2rem; color: var(--neon); margin: 0; }

        /* Social UI */
        .user-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #1a1a1a; }
        .follow-btn { background: var(--neon); color: black; border: none; padding: 5px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .follow-btn.following { background: #262626; color: white; }

        /* Chat UI */
        #chat-window { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1001; display: flex; flex-direction: column; }
        .chat-header { padding: 15px; border-bottom: 1px solid #262626; display: flex; align-items: center; gap: 15px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 70%; padding: 10px 15px; border-radius: 18px; font-size: 0.9rem; }
        .msg-sent { align-self: flex-end; background: var(--purple); border-bottom-right-radius: 4px; }
        .msg-received { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 15px 0; z-index: 100; }
        .nav-item { color: #8e8e8e; cursor: pointer; font-size: 1.5rem; }
        .nav-item.active { color: var(--neon); }
        
        input, button { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; }
    </style>
</head>
<body>

    <div id="loading-screen"><h1 style="font-family:'Orbitron'; color:var(--neon);">CyberGram</h1></div>

    <div id="chat-window" class="hidden">
        <div class="chat-header">
            <button onclick="closeChat()" style="background:none; border:none; color:var(--neon); font-size:1.5rem;">←</button>
            <img id="active-chat-ava" src="" style="width:35px; height:35px; border-radius:50%">
            <b id="active-chat-user"></b>
        </div>
        <div class="chat-messages" id="chat-box"></div>
        <div style="padding:15px; display:flex; gap:10px; border-top:1px solid #262626;">
            <input type="text" id="msg-input" placeholder="Ketik pesan..." style="flex:1">
            <button onclick="sendMsg()" style="background:var(--neon); color:black; border:none; font-weight:bold; border-radius:8px;">KIRIM</button>
        </div>
    </div>

    <div id="auth-screen" class="hidden" style="padding: 100px 20px; text-align: center;">
        <h1 style="font-family: 'Orbitron'; color: var(--neon);">LOGIN</h1>
        <input type="text" id="user" placeholder="Username" style="width:80%"><br>
        <input type="password" id="pass" placeholder="Password" style="width:80%"><br>
        <button onclick="handleLogin()" style="width:80%; background:var(--neon); color:black; margin-top:10px; font-weight:bold;">MASUK</button>
    </div>

    <div id="app-screen" class="hidden">
        <header>
            <h1>CyberGram</h1>
            <div onclick="showPage('chat')" style="cursor:pointer; font-size:1.5rem;">📩</div>
        </header>

        <main id="content">
            <section id="page-home">
                <div id="feed-list"></div>
            </section>

            <section id="page-discover" class="hidden">
                <h2 style="padding:15px;">Explore People</h2>
                <div id="user-list"></div>
            </section>

            <section id="page-chat" class="hidden">
                <h2 style="padding:15px;">Messages</h2>
                <div id="chat-list"></div>
                <p id="chat-empty-msg" class="hidden" style="text-align:center; color:#8e8e8e; padding:20px;">Follow seseorang untuk mulai chat!</p>
            </section>

            <section id="page-profile" class="hidden" style="text-align:center; padding:20px;">
                <img id="my-ava" style="width:100px; height:100px; border-radius:50%; border:2px solid var(--neon);">
                <h2 id="my-name"></h2>
                <button onclick="logout()" style="background:red; color:white; border:none; width:100%; margin-top:20px;">LOGOUT</button>
            </section>
        </main>

        <nav>
            <div class="nav-item active" onclick="showPage('home')">🏠</div>
            <div class="nav-item" onclick="showPage('discover')">🔍</div>
            <div class="nav-item" onclick="showPage('profile')">👤</div>
        </nav>
    </div>

    <script>
        let me = "";
        let activeTarget = "";
        let db = JSON.parse(localStorage.getItem('cg_v12_db') || '{}');
        let msgs = JSON.parse(localStorage.getItem('cg_v12_msgs') || '[]');

        window.onload = function() {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                me = sessionStorage.getItem('activeUser');
                if (me) {
                    document.getElementById('app-screen').classList.remove('hidden');
                    initData();
                } else {
                    document.getElementById('auth-screen').classList.remove('hidden');
                }
            }, 1000);
        };

        function handleLogin() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            if(!u || !p) return;
            if(!db[u]) db[u] = { pw:p, ava:`https://picsum.photos/200/200?sig=${u}`, following:[] };
            if(db[u].pw === p) {
                me = u;
                sessionStorage.setItem('activeUser', u);
                localStorage.setItem('cg_v12_db', JSON.stringify(db));
                location.reload();
            } else alert("Wrong Password!");
        }

        function logout() { sessionStorage.removeItem('activeUser'); location.reload(); }

        function showPage(p) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(p === 'discover') renderUsers();
            if(p === 'chat') renderChatList();
        }

        function initData() {
            document.getElementById('my-name').innerText = me;
            document.getElementById('my-ava').src = db[me].ava;
            // Default following if empty
            if(!db[me].following) db[me].following = [];
        }

        // --- FOLLOW SYSTEM ---
        function renderUsers() {
            const list = document.getElementById('user-list');
            list.innerHTML = Object.keys(db).filter(u => u !== me).map(u => {
                const isFollowing = db[me].following.includes(u);
                return `
                    <div class="user-card">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <img src="${db[u].ava}" style="width:40px; height:40px; border-radius:50%">
                            <b>${u}</b>
                        </div>
                        <button class="follow-btn ${isFollowing?'following':''}" onclick="toggleFollow('${u}')">
                            ${isFollowing ? 'Following' : 'Follow'}
                        </button>
                    </div>`;
            }).join('');
        }

        function toggleFollow(target) {
            let following = db[me].following;
            if(following.includes(target)) {
                db[me].following = following.filter(x => x !== target);
            } else {
                db[me].following.push(target);
            }
            localStorage.setItem('cg_v12_db', JSON.stringify(db));
            renderUsers();
        }

        // --- MESSAGING SYSTEM ---
        function renderChatList() {
            const list = document.getElementById('chat-list');
            const followedUsers = Object.keys(db).filter(u => db[me].following.includes(u));
            
            if(followedUsers.length === 0) {
                document.getElementById('chat-empty-msg').classList.remove('hidden');
                list.innerHTML = "";
            } else {
                document.getElementById('chat-empty-msg').classList.add('hidden');
                list.innerHTML = followedUsers.map(u => `
                    <div class="user-card" onclick="openChat('${u}')" style="cursor:pointer">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <img src="${db[u].ava}" style="width:50px; height:50px; border-radius:50%">
                            <div><b>${u}</b><br><small style="color:var(--neon)">Online</small></div>
                        </div>
                        <span>📩</span>
                    </div>
                `).join('');
            }
        }

        function openChat(target) {
            activeTarget = target;
            document.getElementById('active-chat-user').innerText = target;
            document.getElementById('active-chat-ava').src = db[target].ava;
            document.getElementById('chat-window').classList.remove('hidden');
            renderMsgs();
        }

        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            if(!input.value) return;
            msgs.push({ f:me, t:activeTarget, txt:input.value });
            localStorage.setItem('cg_v12_msgs', JSON.stringify(msgs));
            input.value = "";
            renderMsgs();
        }

        function renderMsgs() {
            const box = document.getElementById('chat-box');
            box.innerHTML = msgs.filter(m => (m.f===me && m.t===activeTarget) || (m.f===activeTarget && m.t===me))
                .map(m => `<div class="msg-bubble ${m.f===me?'msg-sent':'msg-received'}">${m.txt}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
