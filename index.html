<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGram v11 | Messaging System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --dark: #000; --text: #fafafa; --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; margin: 0; padding-bottom: 70px; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* Loading & Header */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .loading-logo { font-family: 'Orbitron'; color: var(--neon); font-size: 3rem; animation: pulse 1.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.05); opacity: 0.9; } }
        header { position: sticky; top: 0; background: var(--dark); padding: 15px; border-bottom: 1px solid #262626; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-family: 'Orbitron'; font-size: 1.2rem; color: var(--neon); margin: 0; }

        /* Chat System UI */
        #page-chat { padding: 10px; }
        .chat-user-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid #262626; cursor: pointer; }
        .chat-user-item:hover { background: rgba(255,255,255,0.05); }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        
        #chat-window { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1001; display: flex; flex-direction: column; }
        .chat-header { padding: 15px; border-bottom: 1px solid #262626; display: flex; align-items: center; gap: 15px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 70%; padding: 10px 15px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; }
        .msg-sent { align-self: flex-end; background: var(--purple); color: white; border-bottom-right-radius: 4px; }
        .msg-received { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }
        .chat-input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #262626; }

        /* Feed & Stories */
        .stories-bar { display: flex; overflow-x: auto; padding: 10px; gap: 15px; border-bottom: 1px solid #262626; scrollbar-width: none; }
        .story-item { text-align: center; min-width: 70px; cursor: pointer; }
        .story-ring { width: 60px; height: 60px; border-radius: 50%; background: var(--insta-grad); padding: 3px; margin-bottom: 5px; }
        .story-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #000; padding: 2px; }
        .post-card { border-bottom: 1px solid #262626; margin-bottom: 10px; }
        .p-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }

        /* Nav */
        nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 15px 0; z-index: 100; }
        .nav-item { color: #8e8e8e; cursor: pointer; font-size: 1.5rem; }
        .nav-item.active { color: var(--neon); }

        input, button { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; }
        button { background: var(--neon); color: black; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <div id="loading-screen"><h1 class="loading-logo">CyberGram</h1></div>

    <div id="chat-window" class="hidden">
        <div class="chat-header">
            <button onclick="closeChat()" style="background:none; color:var(--neon); font-size:1.5rem; width:auto; padding:0;">←</button>
            <img id="active-chat-ava" src="" style="width:35px; height:35px; border-radius:50%">
            <b id="active-chat-user">User</b>
        </div>
        <div class="chat-messages" id="chat-messages-box"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Tulis pesan..." style="flex:1">
            <button onclick="sendDirectMessage()">KIRIM</button>
        </div>
    </div>

    <div id="auth-screen" class="hidden" style="padding: 100px 20px; text-align: center;">
        <h1 style="font-family: 'Orbitron'; color: var(--neon);">CYBERGRAM</h1>
        <input type="text" id="user" placeholder="Username" style="width:80%"><br>
        <input type="password" id="pass" placeholder="Password" style="width:80%"><br>
        <button onclick="handleLogin()" style="width:80%">LOGIN / REGISTER</button>
    </div>

    <div id="app-screen" class="hidden">
        <header>
            <h1>CyberGram</h1>
            <div onclick="showPage('chat')" style="cursor:pointer; font-size:1.5rem;">📩</div>
        </header>

        <main id="content">
            <section id="page-home">
                <div class="stories-bar" id="stories-list"></div>
                <div id="feed-list"></div>
            </section>

            <section id="page-chat" class="hidden">
                <h2 style="padding: 0 15px;">Pesan</h2>
                <div id="chat-users-list"></div>
            </section>

            <section id="page-post" class="hidden" style="padding: 20px;">
                <h2>Post Baru</h2>
                <input type="text" id="post-url" placeholder="URL Gambar" style="width:100%"><br>
                <input type="text" id="post-cap" placeholder="Caption" style="width:100%"><br>
                <button onclick="addPost()" style="width:100%">SHARE</button>
            </section>

            <section id="page-profile" class="hidden" style="padding: 20px; text-align: center;">
                <img id="my-avatar" style="width:100px; height:100px; border-radius:50%; border:2px solid var(--neon);">
                <h2 id="my-name">User</h2>
                <button onclick="logout()" style="background:red; color:white; margin-top:20px;">LOGOUT</button>
            </section>
        </main>

        <nav>
            <div class="nav-item active" onclick="showPage('home')">🏠</div>
            <div class="nav-item" onclick="showPage('post')">➕</div>
            <div class="nav-item" onclick="showPage('profile')">👤</div>
        </nav>
    </div>

    <script>
        let me = "";
        let activeTarget = "";
        let db = JSON.parse(localStorage.getItem('cg_v11_db') || '{}');
        let posts = JSON.parse(localStorage.getItem('cg_v11_posts') || '[]');
        let messages = JSON.parse(localStorage.getItem('cg_v11_msgs') || '[]');

        window.onload = function() {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                me = sessionStorage.getItem('activeUser');
                if (me) {
                    document.getElementById('app-screen').classList.remove('hidden');
                    initData();
                } else {
                    document.getElementById('auth-screen').classList.remove('hidden');
                }
            }, 1500);
        };

        function handleLogin() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            if(!u || !p) return;
            if(!db[u]) db[u] = { pw:p, ava:`https://picsum.photos/200/200?sig=${u}` };
            if(db[u].pw === p) {
                me = u;
                sessionStorage.setItem('activeUser', u);
                localStorage.setItem('cg_v11_db', JSON.stringify(db));
                location.reload();
            } else alert("Salah!");
        }

        function logout() { sessionStorage.removeItem('activeUser'); location.reload(); }

        function showPage(p) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(event.currentTarget.classList) event.currentTarget.classList.add('active');
            if(p === 'chat') renderChatUsers();
        }

        function initData() {
            document.getElementById('my-name').innerText = me;
            document.getElementById('my-avatar').src = db[me].ava;
            renderStories();
            renderFeed();
        }

        function renderStories() {
            const list = document.getElementById('stories-list');
            list.innerHTML = Object.keys(db).map(u => `
                <div class="story-item">
                    <div class="story-ring"><img src="${db[u].ava}"></div>
                    <span>${u}</span>
                </div>
            `).join('');
        }

        function renderFeed() {
            document.getElementById('feed-list').innerHTML = posts.map(p => `
                <div class="post-card">
                    <div style="padding:10px; display:flex; align-items:center; gap:10px;">
                        <img src="${p.ava}" style="width:30px; height:30px; border-radius:50%">
                        <b>${p.u}</b>
                    </div>
                    <img src="${p.img}" class="p-img">
                    <div style="padding:10px"><b>${p.u}</b> ${p.cap}</div>
                </div>
            `).join('');
        }

        function addPost() {
            const url = document.getElementById('post-url').value || `https://picsum.photos/500/500?sig=${Math.random()}`;
            posts.unshift({ u:me, img:url, cap:document.getElementById('post-cap').value, ava:db[me].ava });
            localStorage.setItem('cg_v11_posts', JSON.stringify(posts));
            showPage('home'); renderFeed();
        }

        // --- MESSAGING LOGIC ---
        function renderChatUsers() {
            const list = document.getElementById('chat-users-list');
            list.innerHTML = Object.keys(db).filter(u => u !== me).map(u => `
                <div class="chat-user-item" onclick="openChatWindow('${u}')">
                    <img src="${db[u].ava}" class="chat-avatar">
                    <div>
                        <b>${u}</b><br>
                        <small style="color:#8e8e8e">Klik untuk mengirim pesan</small>
                    </div>
                </div>
            `).join('');
        }

        function openChatWindow(target) {
            activeTarget = target;
            document.getElementById('active-chat-user').innerText = target;
            document.getElementById('active-chat-ava').src = db[target].ava;
            document.getElementById('chat-window').classList.remove('hidden');
            renderDirectMessages();
        }

        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }

        function sendDirectMessage() {
            const input = document.getElementById('msg-input');
            if(!input.value) return;
            messages.push({ from: me, to: activeTarget, text: input.value, time: Date.now() });
            localStorage.setItem('cg_v11_msgs', JSON.stringify(messages));
            input.value = "";
            renderDirectMessages();
        }

        function renderDirectMessages() {
            const box = document.getElementById('chat-messages-box');
            const myMsgs = messages.filter(m => 
                (m.from === me && m.to === activeTarget) || (m.from === activeTarget && m.to === me)
            );
            box.innerHTML = myMsgs.map(m => `
                <div class="msg-bubble ${m.from === me ? 'msg-sent' : 'msg-received'}">
                    ${m.text}
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
